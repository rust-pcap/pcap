name: 'Upstream drift detection'

# Weekly test on link type and status code changes. The additions the script can write
# arrive as a pull request; entries that require manual review fail the run.

on:
  schedule:
    - cron: "20 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  upstream-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: release
        run: |
          tag="$(git ls-remote --tags --refs https://github.com/the-tcpdump-group/libpcap.git \
            | sed 's#.*refs/tags/##' \
            | grep -E '^libpcap-[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1)"
          if [ -z "$tag" ]; then
            echo "No libpcap release tag matched" >&2
            exit 1
          fi
          echo "Newest release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#libpcap-}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: 'the-tcpdump-group/libpcap'
          ref: ${{ steps.release.outputs.tag }}
          path: 'libpcap'
      - id: drift
        run: |
          set +e
          python3 .github/scripts/upstream_drift.py \
            --libpcap libpcap \
            --tag '${{ steps.release.outputs.tag }}' \
            --write \
            --pr-body "$RUNNER_TEMP/body.md" \
            --run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0 matches, 2 is drift written below, 3 is drift that requires manual review.
          case "$code" in 0|2|3) ;; *) exit "$code" ;; esac
      - if: steps.drift.outputs.code != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            src
            CHANGELOG.md
          branch: 'upstream-drift'
          base: 'main'
          title: '🆕 Drift detection: libpcap ${{ steps.release.outputs.version }}'
          body-path: ${{ runner.temp }}/body.md
          commit-message: |
            Sync new constants with libpcap ${{ steps.release.outputs.version }}

            Automated by .github/scripts/upstream_drift.py
          labels: 'upstream drift'
      # A rename, a changed value, and a new enum variant are never written above, so the
      # run fails to report them.
      - if: steps.drift.outputs.code == '3'
        run: |
          echo "::error::libpcap ${{ steps.release.outputs.version }} declares changes that require manual review"
          exit 1
